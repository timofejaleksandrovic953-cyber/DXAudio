name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }
    - uses: android-actions/setup-android@v4
      with: { packages: 'platform-tools platforms;android-34 build-tools;34.0.0', accept-android-sdk-licenses: true }
    - uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: '8.11.1' }
      
    - name: 🏷️ Extract Version
      run: echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

    - name: 🎨 Install ImageMagick & Generate App Icons
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
        ICON_SRC="src/icon.png"
        RES_DIR="app/src/main/res"
        
        if [ ! -f "$ICON_SRC" ]; then
          echo "⚠️ Icon not found at $ICON_SRC. Generating purple placeholder..."
          mkdir -p src; convert -size 512x512 xc:"#BB86FC" "$ICON_SRC"
        fi

        make_icon() {
          mkdir -p "$RES_DIR/mipmap-$1"
          convert "$ICON_SRC" -resize ${2}x${2} "$RES_DIR/mipmap-$1/ic_launcher.png"
          cp "$RES_DIR/mipmap-$1/ic_launcher.png" "$RES_DIR/mipmap-$1/ic_launcher_round.png"
          echo "  ✅ mipmap-$1 ($2 x $2)"
        }

        make_icon "mdpi"    48
        make_icon "hdpi"    72
        make_icon "xhdpi"   96
        make_icon "xxhdpi"  144
        make_icon "xxxhdpi" 192

    - name: Bootstrap Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.11.1 --no-daemon; fi
        chmod +x ./gradlew

    - name: 🏗️ Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --console=plain --quiet

    - name: 📦 Upload Debug Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXAudio-debug-${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/debug/app-debug.apk
