name: Build DXAudio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1' # Указываем версию, которая будет использоваться для генерации wrapper'а

    - name: Bootstrap Gradle Wrapper
      working-directory: .
      run: |
        if [ ! -f ./gradlew ]; then
          echo "gradlew not found, generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x ./gradlew
      # Этот шаг проверяет наличие gradlew. Если его нет, он генерирует его с помощью установленного Gradle 8.5.
      # После этого делает файл исполняемым, чтобы избежать ошибки "Permission denied".

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXAudio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
