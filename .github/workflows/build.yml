name: Build DXAudio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Bootstrap Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper --gradle-version 8.11.1 --no-daemon
        fi
        chmod +x ./gradlew

    - name: 🎨 Generate App Icons
      run: |
        ICON_SRC="src/icon.png"
        RES_DIR="app/src/main/res"

        # Если иконки нет — создаем временный плейсхолдер, чтобы сборка не упала
        if [ ! -f "$ICON_SRC" ]; then
          echo "⚠️ Icon not found at $ICON_SRC. Generating purple placeholder..."
          mkdir -p src
          convert -size 512x512 xc:"#BB86FC" "$ICON_SRC"
        fi

        echo "🎨 Resizing $ICON_SRC into all Android densities..."

        # Автоопределение команды ImageMagick (в новых версиях это magick, в старых - convert)
        if command -v magick &> /dev/null; then
          IM_CMD="magick"
        else
          IM_CMD="convert"
        fi

        make_icon() {
          DENSITY=$1
          SIZE=$2
          mkdir -p "$RES_DIR/mipmap-$DENSITY"
          $IM_CMD "$ICON_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/mipmap-$DENSITY/ic_launcher.png"
          cp "$RES_DIR/mipmap-$DENSITY/ic_launcher.png" "$RES_DIR/mipmap-$DENSITY/ic_launcher_round.png"
          echo "  ✅ mipmap-$DENSITY ($SIZE x $SIZE)"
        }

        make_icon "mdpi"    48
        make_icon "hdpi"    72
        make_icon "xhdpi"   96
        make_icon "xxhdpi"  144
        make_icon "xxxhdpi" 192

        echo "🎉 Icons are ready!"

    - name: 🏗️ Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --console=plain --quiet

    - name: 📦 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXAudio-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
