name: Build DXAudio APK

on:
  # Запуск при создании тега (релиза) вида v1.0.0
  push:
    tags:
      - 'v*'
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    # --- ШАГ ОПРЕДЕЛЕНИЯ ВЕРСИИ ---
    - name: 🏷️ Extract Version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          # Если это тег (например, v1.0.5), берем всё после 'v'
          VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          VERSION_CODE=$(echo $VERSION_NAME | awk -F. '{print $1*10000 + $2*100 + $3}')
        else
          # Если запущен вручную, ставим версию на основе номера запуска
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
        fi
        
        echo "Собираем версию: $VERSION_NAME (код: $VERSION_CODE)"
        
        # Сохраняем переменные в окружение, чтобы Gradle их увидел
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: 🎨 Install ImageMagick & Generate App Icons
      run: |
        echo "📦 Installing ImageMagick..."
        sudo apt-get update -qq
        sudo apt-get install -y -qq imagemagick

        ICON_SRC="src/icon.png"
        RES_DIR="app/src/main/res"

        if [ ! -f "$ICON_SRC" ]; then
          echo "⚠️ Icon not found at $ICON_SRC. Generating purple placeholder..."
          mkdir -p src
          convert -size 512x512 xc:"#BB86FC" "$ICON_SRC"
        fi

        echo "🎨 Resizing $ICON_SRC into all Android densities..."

        make_icon() {
          DENSITY=$1
          SIZE=$2
          mkdir -p "$RES_DIR/mipmap-$DENSITY"
          convert "$ICON_SRC" -resize ${SIZE}x${SIZE} "$RES_DIR/mipmap-$DENSITY/ic_launcher.png"
          cp "$RES_DIR/mipmap-$DENSITY/ic_launcher.png" "$RES_DIR/mipmap-$DENSITY/ic_launcher_round.png"
          echo "  ✅ mipmap-$DENSITY ($SIZE x $SIZE)"
        }

        make_icon "mdpi"    48
        make_icon "hdpi"    72
        make_icon "xhdpi"   96
        make_icon "xxhdpi"  144
        make_icon "xxxhdpi" 192

    - name: Bootstrap Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper --gradle-version 8.11.1 --no-daemon
        fi
        chmod +x ./gradlew

    - name: 🏗️ Build Debug APK
      # Переменные из $GITHUB_ENV автоматически подхватятся Gradle
      run: ./gradlew assembleDebug --no-daemon --console=plain --quiet

    - name: 📦 Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        # Название файла теперь содержит версию
        name: DXAudio-debug-${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/debug/app-debug.apk
