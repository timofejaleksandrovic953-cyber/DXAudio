name: Release DXAudio

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }
    - uses: android-actions/setup-android@v4
      with: { packages: 'platform-tools platforms;android-34 build-tools;34.0.0', accept-android-sdk-licenses: true }
    - uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: '8.11.1' }
    - name: 🏷️ Extract Version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          VERSION_CODE=$(echo $VERSION_NAME | awk -F. '{print $1*10000 + $2*100 + $3}')
        else
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
        fi
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: 🔐 Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > ${{ runner.temp }}/release.jks
        echo "KEYSTORE_FILE=${{ runner.temp }}/release.jks" >> $GITHUB_ENV
        echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
        echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
        echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

    - name: 🎨 Install ImageMagick & Generate App Icons
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
        # (скрипт генерации иконок из прошлого шага)

    - name: Bootstrap Gradle Wrapper
      run: |
        if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.11.1 --no-daemon; fi
        chmod +x ./gradlew

    - name: 🏗️ Build Signed Release APK
      run: ./gradlew assembleRelease --no-daemon --console=plain --quiet

    - name: 📦 Upload APK to Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DXAudio-release-${{ env.VERSION_NAME }}
        path: app/build/outputs/apk/release/app-release.apk

    - name: 🚀 Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        name: DXAudio v${{ env.VERSION_NAME }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
