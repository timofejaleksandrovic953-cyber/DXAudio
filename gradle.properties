# Включаем поддержку AndroidX
android.useAndroidX=true
# Включаем Jetifier для совместимости сторонних библиотек
android.enableJetifier=true
# Увеличиваем память для Gradle до 4 ГБ
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Принудительно устанавливаем стандартный уровень логирования
org.gradle.logging.level=lifecycle
# Ограничиваем стектрейсы только внутренними ошибками Gradle
org.gradle.logging.stacktrace=internal
